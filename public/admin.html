<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#172733"><title>管理台 · 下一位</title><link rel="icon" type="image/svg+xml" href="/mark.svg"><link rel="stylesheet" href="/style.css"><script defer src="/admin.js"></script></head>
<body class="admin-body"><main class="admin-page"><div class="topline"><a class="identity dark" href="/"><span class="identity-mark" aria-hidden="true"><i></i><i></i></span><span>下一位<small>INVITE RELAY</small></span></a><a href="/">返回站点 ↗</a></div><header class="admin-heading"><p class="overline">CONTROL DESK</p><h1>管理台</h1><p>输入管理令牌后可查看邀请码、统计和状态。令牌只在当前页面内存中使用。</p></header><form id="auth-form" class="auth"><label for="token">管理令牌</label><div class="input-row"><input id="token" type="password" autocomplete="off" required><button>读取清单 <span aria-hidden="true">→</span></button></div></form><p class="message" id="admin-message" role="status"></p><div id="admin-content" hidden><div class="admin-stats"><div><span>全部</span><strong id="total">—</strong></div><div><span>活跃</span><strong id="active">—</strong></div><div><span>暂停</span><strong id="paused">—</strong></div><div><span>领取记录</span><strong id="claims">—</strong></div></div><section class="admin-list-section"><div class="admin-toolbar"><h2>邀请码清单</h2><select id="status-filter" aria-label="状态筛选"><option value="">全部状态</option><option>ACTIVE</option><option>PAUSED</option><option>REMOVED</option></select></div><div id="admin-list"></div><button id="more-button" class="secondary" type="button" hidden>加载更多</button></section></div></main></body></html>
